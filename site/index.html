<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Benchmark · Corese</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=36">
  <script>
    (() => {
      const mode = localStorage.getItem('corese-theme-mode') || 'system';
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      let resolved = mode;
      if (mode === 'system') {
        resolved = systemDark ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = resolved;
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <nav class="brand" aria-label="Main navigation">
        <!-- Corese official logo -->
        <a class="brand__logo" href="https://project.inria.fr/corese/" target="_blank" rel="noopener" title="Official Corese portal (Inria)">
          <img src="assets/logo/corese.svg" alt="Corese" class="brand__logo-img">
        </a>

        <!-- Suite root: Corese -->
        <a class="brand__root" href="https://project.inria.fr/corese/" target="_blank" rel="noopener" title="Corese Project">
          Corese
        </a>

        <!-- Breadcrumb separator -->
        <span class="brand__sep" aria-hidden="true">/</span>

        <!-- Active suite tool switcher: Benchmark ▾ -->
        <div class="menu">
          <button class="menu__trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="suite-menu" title="Switch to another tool in the Corese Suite">
            <span class="menu__label">Benchmark</span>
            <svg class="menu__chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <ul class="menu__list" id="suite-menu" aria-label="Corese Suite" hidden>
            <li><a class="menu__item" href="https://github.com/corese-stack/corese-core" target="_blank" rel="noopener">Corese Core</a></li>
            <li><a class="menu__item" href="https://corese.inria.fr/" target="_blank" rel="noopener">Corese Server</a></li>
            <li><a class="menu__item" href="https://project.inria.fr/corese/" target="_blank" rel="noopener">Corese Command</a></li>
            <li><a class="menu__item" href="https://project.inria.fr/corese/" target="_blank" rel="noopener">Corese GUI</a></li>
            <li class="menu__divider" aria-hidden="true"></li>
            <li><a class="menu__item is-active" href="./" aria-current="page">Benchmark</a></li>
            <li><a class="menu__item" href="https://corese-stack.github.io/corese-w3c/" target="_blank" rel="noopener">W3C Conformance</a></li>
          </ul>
        </div>
      </nav>

      <!-- Right actions: GitHub & Theme -->
      <div class="topbar__actions">
        <!-- Project GitHub link -->
        <a class="topbar__action-btn" href="https://github.com/corese-stack/corese-benchmark" target="_blank" rel="noopener" aria-label="Source code on GitHub (corese-benchmark)" title="Source code on GitHub (corese-benchmark)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          <span class="sr-only">GitHub</span>
        </a>

        <!-- Theme switcher button (System / Light / Dark) -->
        <button class="topbar__action-btn theme-toggle" type="button" data-theme-mode="system" aria-label="Theme: System (automatic)" title="Theme: System (automatic)">
          <!-- System icon (monitor) -->
          <svg class="theme-toggle__icon theme-toggle__icon--system" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="2.5" width="12" height="8.5" rx="1.5"/>
            <path d="M5.5 14h5M8 11v3"/>
          </svg>
          <!-- Light icon (sun) -->
          <svg class="theme-toggle__icon theme-toggle__icon--light" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="8" cy="8" r="3.25"/>
            <path d="M8 1.5v1.5M8 13v1.5M1.5 8h1.5M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06"/>
          </svg>
          <!-- Dark icon (moon) -->
          <svg class="theme-toggle__icon theme-toggle__icon--dark" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13.5 9.2A5.5 5.5 0 1 1 6.8 2.5a4.5 4.5 0 0 0 6.7 6.7z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Sticky Engines Toolbar -->
  <aside class="engines-bar" aria-label="Benchmark Engines">
    <div class="engines-bar__inner">
      <span class="engines-bar__label">Engines:</span>
      <div class="engines-bar__scroller" id="engines-scroller">
        <ul class="engines-bar__chips" id="active-engines-chips" aria-label="Selected engines for benchmark comparison">
          <!-- Rendered dynamically from real report data -->
        </ul>
      </div>
      <div class="sr-only" id="chips-announcer" aria-live="polite" aria-atomic="true"></div>

      <!-- Add Engine Button with Miller Columns Popover -->
      <div class="engine-picker">
        <button class="engine-picker__btn" id="btn-add-engine" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="miller-popover" aria-label="Add benchmark engine" title="Add benchmark engine">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
            <path d="M6 2.5v7M2.5 6h7"/>
          </svg>
          <span class="engine-picker__text">Add Engine</span>
        </button>

        <!-- 3-Column Miller Popover: custom multi-column selector widget -->
        <section class="miller-popover" id="miller-popover" aria-label="Select Engine, Version and Storage" data-step="1" hidden>
          <div class="miller-popover__header">
            <button type="button" class="miller__back" id="btn-miller-back"><span aria-hidden="true">‹ </span>Back</button>
            <span class="miller-popover__step" data-step-title="1">1. Engine</span>
            <span class="miller-popover__step" data-step-title="2">2. Version</span>
            <span class="miller-popover__step" data-step-title="3">3. Storage</span>
          </div>

          <div class="miller-popover__viewport">
            <div class="miller-popover__body">
              <div class="miller__col miller__col--engines"></div>
              <div class="miller__col miller__col--versions"></div>
              <div class="miller__col miller__col--storages"></div>
            </div>
          </div>

          <div class="miller-popover__footer">
            <div class="miller__preview-wrap">
              <span class="miller__preview-label">Engine:</span>
              <span class="miller__preview">Corese · 4.6.5 · In-Memory</span>
            </div>
            <button type="button" class="miller__confirm-btn" id="btn-confirm-engine">Add</button>
          </div>
        </section>
      </div>
    </div>
  </aside>

  <nav class="benchmark-nav" aria-label="Benchmarks">
    <div class="benchmark-nav__inner">
      <div class="benchmark-tabs" role="tablist" aria-label="Benchmark Capabilities" id="benchmark-tabs">
        <button type="button" role="tab" class="benchmark-tab is-active" id="tab-overview" aria-selected="true" aria-controls="benchmark-panel" tabindex="0" data-view="overview">
          Overview
        </button>
        <button type="button" role="tab" class="benchmark-tab" id="tab-loading" aria-selected="false" aria-controls="benchmark-panel" tabindex="-1" data-view="loading">
          RDF Loading
        </button>
        <button type="button" role="tab" class="benchmark-tab" id="tab-sparql" aria-selected="false" aria-controls="benchmark-panel" tabindex="-1" data-view="sparql">
          SPARQL Queries
        </button>
        <span class="benchmark-tabs__indicator" aria-hidden="true" id="benchmark-tabs-indicator"></span>
      </div>
    </div>
  </nav>

  <main class="dashboard-main" id="dashboard-main">
    <section class="benchmark-panel" id="benchmark-panel" role="tabpanel" aria-labelledby="tab-overview"></section>
  </main>

  <script type="module" src="./js/main.js?v=37"></script>

  <script>
    (() => {
      const trigger = document.querySelector('.menu__trigger');
      const list = document.getElementById('suite-menu');

      const setOpen = (open) => {
        trigger.setAttribute('aria-expanded', String(open));
        list.hidden = !open;
      };

      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        setOpen(list.hidden);
      });

      document.addEventListener('click', (e) => {
        if (!list.hidden && !list.contains(e.target)) setOpen(false);
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !list.hidden) {
          setOpen(false);
          trigger.focus();
        }
      });

      // 3-state theme management: System (default) ➔ Light ➔ Dark ➔ System
      const themeToggle = document.querySelector('.theme-toggle');
      const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
      const MODES = ['system', 'light', 'dark'];
      const LABELS = {
        system: 'Theme: System (automatic)',
        light: 'Theme: Light',
        dark: 'Theme: Dark'
      };

      const getSavedMode = () => {
        const mode = localStorage.getItem('corese-theme-mode');
        return MODES.includes(mode) ? mode : 'system';
      };

      const applyTheme = (mode) => {
        let resolved = mode;
        if (mode === 'system') {
          resolved = mediaQuery.matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = resolved;
        themeToggle.dataset.themeMode = mode;
        themeToggle.setAttribute('aria-label', LABELS[mode]);
        themeToggle.setAttribute('title', LABELS[mode]);
        window.dispatchEvent(new CustomEvent('theme-changed', { detail: { theme: resolved } }));
      };

      let currentMode = getSavedMode();
      applyTheme(currentMode);

      themeToggle.addEventListener('click', () => {
        const nextIdx = (MODES.indexOf(currentMode) + 1) % MODES.length;
        currentMode = MODES[nextIdx];
        if (currentMode === 'system') {
          localStorage.removeItem('corese-theme-mode');
        } else {
          localStorage.setItem('corese-theme-mode', currentMode);
        }
        applyTheme(currentMode);
      });

      mediaQuery.addEventListener('change', () => {
        if (currentMode === 'system') {
          applyTheme('system');
        }
      });
    })();
  </script>
</body>
</html>
