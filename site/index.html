<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corese Benchmark Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/chart.umd.min.js"></script>
  <script src="data/report-data.js" onerror="console.warn('report-data.js not found, will try fetch fallback')"></script>
</head>
<body>
<div class="app-wrapper">

  <!-- Header -->
  <header class="page-header">
    <div class="header-top">
      <div class="header-brand">
        <h1 class="brand-title">Corese Benchmark Dashboard</h1>
      </div>
      <div class="header-actions">
        <button id="export-json-btn" class="export-btn" title="Download JSON report" style="display:none">&#8595; Export JSON</button>
        <button id="export-md-btn" class="export-btn" title="Download Markdown report" style="display:none">&#8595; Export MD</button>
        <button id="export-pdf-btn" class="export-btn" title="Print / Export PDF" style="display:none">&#8600; Export PDF</button>
        <button id="theme-toggle" class="theme-toggle-btn" title="Toggle light/dark theme">&#9788;</button>
      </div>
    </div>

    <!-- Sticky environment pill -->
    <div class="sticky-pill" id="sticky-pill" title="Click to view machine details"></div>

    <!-- Engine filter toggles -->
    <div class="engine-bar" id="engine-bar"></div>

    <!-- Navigation tabs -->
    <nav class="tab-bar" id="tab-bar"></nav>
  </header>

  <!-- Error state -->
  <div id="error-state" class="error-state" style="display:none">
    <div class="error-icon">!</div>
    <div class="error-title">No Data Available</div>
    <div class="error-message">Could not load benchmark data.</div>
    <p class="error-hint">Check that <code>data/benchmark-report.json</code> or <code>data/mock-report-v2.json</code> exists.</p>
  </div>

  <!-- Main content area (pages render here) -->
  <main id="main-content" class="main-content"></main>

</div>

<footer class="page-footer">
  <p>
    <a href="https://github.com/corese-stack/corese-benchmark" target="_blank" rel="noopener">corese-stack/corese-benchmark</a>
    &middot; Protocol: warmup + 3 repetitions + median
    &middot; <a href="https://project.inria.fr/corese/" target="_blank" rel="noopener">Corese Engine</a> &mdash; Inria Wimmics
  </p>
</footer>

<script>
  (function() {
    var saved = localStorage.getItem('theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    document.addEventListener('DOMContentLoaded', function() {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      function update() {
        var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        btn.textContent = isDark ? '\u2600' : '\u263D';
        btn.title = isDark ? 'Passer en thème clair' : 'Passer en thème sombre';
      }
      update();
      btn.addEventListener('click', function() {
        var isLight = document.documentElement.getAttribute('data-theme') === 'light';
        var next = isLight ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        update();
      });
    });
  })();
</script>
<script src="js/bundle.js"></script>
</body>
</html>
