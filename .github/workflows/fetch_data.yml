name: Fetch Benchmark Data from Runner Disk

on:
  workflow_dispatch:

jobs:
  fetch-disk-data:
    runs-on: [self-hosted, corese-benchmark]
    steps:
      - name: Package existing benchmark report from runner disk
        run: |
          mkdir -p /tmp/benchmark_artifacts
          # The runner persistent workspace holds the latest run outputs
          find . -name "benchmark-report.json" -o -name "benchmark-report.csv"
          cp -v ./site/data/benchmark-report.json /tmp/benchmark_artifacts/ 2>/dev/null || true
          cp -v ./site/data/benchmark-report.csv /tmp/benchmark_artifacts/ 2>/dev/null || true
          # Fallback check under absolute storage path if running in clean directory
          if [ ! -f /tmp/benchmark_artifacts/benchmark-report.json ]; then
            cp -v /media/storage/actions-runners-work/corese-benchmark/corese-benchmark/site/data/benchmark-report.json /tmp/benchmark_artifacts/ 2>/dev/null || true
            cp -v /media/storage/actions-runners-work/corese-benchmark/corese-benchmark/site/data/benchmark-report.csv /tmp/benchmark_artifacts/ 2>/dev/null || true
          fi
          ls -lh /tmp/benchmark_artifacts/

      - name: Upload persistent artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-from-disk
          path: /tmp/benchmark_artifacts/
          retention-days: 30
