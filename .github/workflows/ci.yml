name: Benchmark & Deploy to GitHub Pages

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Dataset to benchmark'
        required: false
        default: 'dbpedia'
        type: choice
        options: [dbpedia, bowlogna, bsbm, lubm]
      engines:
        description: 'Comma-separated engines (e.g. corese.4.6.5,jena.6.2.0)'
        required: false
        default: 'corese.4.6.5,jena.6.2.0,rdf4j.5.3.2'
      scales:
        description: 'Dataset scales'
        required: false
        default: 'small,medium,large'
      inference:
        description: 'Enable RDFS inference (Corese only)'
        required: false
        default: false
        type: boolean

jobs:

  # ─── Smoke test on PR (GitHub-hosted, fast) ───────────────────────────────
  smoke-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: python-utils/environment.yml
          activate-environment: benchmarkenv
          auto-activate-base: false

      - name: Run smoke test (dbpedia small only)
        shell: bash -l {0}
        run: |
          python python-utils/workflow.py \
            --engines="corese.4.6.5,jena.6.2.0,rdf4j.5.3.2" \
            --dataset="dbpedia" \
            --scales="small"

      - name: Check site/data output
        run: ls -la ./site/data/

  # ─── Full benchmark on merge to main (P16 self-hosted) ────────────────────
  benchmark-node:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, corese-benchmark]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build corese-core (feature/corese-next)
        run: |
          which javac || sudo apt-get install -y openjdk-21-jdk -q
          rm -rf /tmp/corese-core
          git clone --depth=1 --branch feature/corese-next \
            https://github.com/corese-stack/corese-core.git /tmp/corese-core
          cd /tmp/corese-core
          ./gradlew assemble -x test -q
          cp build/libs/corese-core-*.jar "$GITHUB_WORKSPACE/libs/corese-core-local.jar"

      - name: Set up conda environment
        run: |
          CONDA_SH=$(find $HOME -name "conda.sh" -path "*/profile.d/conda.sh" -not -path "*/pkgs/*" 2>/dev/null | head -1)
          source "$CONDA_SH"
          conda env update -f python-utils/environment.yml --prune

      - name: Run full benchmark
        run: |
          CONDA_SH=$(find $HOME -name "conda.sh" -path "*/profile.d/conda.sh" -not -path "*/pkgs/*" 2>/dev/null | head -1)
          source "$CONDA_SH"
          conda activate benchmarkenv
          python python-utils/workflow.py \
            --engines="corese.local,corese.4.6.5,jena.6.2.0,rdf4j.5.3.2" \
            --datasets="dbpedia,bowlogna"

      - name: Check site/data output
        run: ls -la ./site/data/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true

  # ─── Manual run (workflow_dispatch) ───────────────────────────────────────
  benchmark-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, corese-benchmark]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build corese-core (feature/corese-next)
        run: |
          which javac || sudo apt-get install -y openjdk-21-jdk -q
          rm -rf /tmp/corese-core
          git clone --depth=1 --branch feature/corese-next \
            https://github.com/corese-stack/corese-core.git /tmp/corese-core
          cd /tmp/corese-core
          ./gradlew assemble -x test -q
          cp build/libs/corese-core-*.jar "$GITHUB_WORKSPACE/libs/corese-core-local.jar"

      - name: Set up conda environment
        run: |
          CONDA_SH=$(find $HOME -name "conda.sh" -path "*/profile.d/conda.sh" -not -path "*/pkgs/*" 2>/dev/null | head -1)
          source "$CONDA_SH"
          conda env update -f python-utils/environment.yml --prune

      - name: Run benchmark
        run: |
          CONDA_SH=$(find $HOME -name "conda.sh" -path "*/profile.d/conda.sh" -not -path "*/pkgs/*" 2>/dev/null | head -1)
          source "$CONDA_SH"
          conda activate benchmarkenv
          python python-utils/workflow.py \
            --engines="${{ github.event.inputs.engines }}" \
            --dataset="${{ github.event.inputs.dataset }}" \
            --scales="${{ github.event.inputs.scales }}" \
            ${{ github.event.inputs.inference == 'true' && '--inference' || '' }}

      - name: Check site/data output
        run: ls -la ./site/data/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
