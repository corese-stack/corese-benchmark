name: Benchmark & Deploy to GitHub Pages

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      datasets:
        description: 'Datasets à benchmarker (séparés par virgule : dbpedia,bowlogna,bsbm,lubm)'
        required: false
        default: 'dbpedia,bowlogna,lubm'
      engines:
        description: 'Comma-separated engines (e.g. corese.4.6.5,jena.6.2.0)'
        required: false
        default: 'corese.4.6.5,jena.6.2.0,rdf4j.5.3.2'
      scales:
        description: 'Dataset scales'
        required: false
        default: 'small,medium,large'
      corese_commit:
        description: 'Commit Corese à benchmarker (ex: b8dbc158). Laisse vide pour ignorer.'
        required: false
        default: ''
      inference:
        description: 'Enable RDFS inference (Corese only)'
        required: false
        default: false
        type: boolean
      cached_engines:
        description: 'Engines dont les résultats sont lus depuis le cache (ex: jena.6.2.0,rdf4j.5.3.2). Vide = tout re-runner.'
        required: false
        default: ''
      force_all_engines:
        description: 'Ignore baseline and force fresh execution of all engines'
        required: false
        default: false
        type: boolean
      update_baseline:
        description: 'Update site/data/baseline.json with newly measured immutable engine runs'
        required: false
        default: false
        type: boolean

jobs:

  # ─── Smoke test on PR (GitHub-hosted, fast) ───────────────────────────────
  smoke-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: python-utils/environment.yml
          activate-environment: benchmarkenv
          auto-activate-base: false

      - name: Run smoke test (dbpedia small only)
        shell: bash -l {0}
        run: |
          python python-utils/workflow.py \
            --engines="corese.4.6.5,jena.6.2.0,rdf4j.5.3.2" \
            --dataset="dbpedia" \
            --scales="small"

      - name: Check site/data output
        run: ls -la ./site/data/

  # ─── Full benchmark on merge to main (P16 self-hosted) ────────────────────
  benchmark-node:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, corese-benchmark]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Clean old artifacts (>30 days)
        run: |
          find out/ -name "*.json" -mtime +30 -delete 2>/dev/null || true
          rm -rf build/

      - name: Build corese.next JAR
        env:
          CORESE_COMMIT: 1215ab78adbfad7f0edc20e212446780a23182c1
        run: |
          CORESE_DIR="$HOME/corese-next-build"
          if [ ! -d "$CORESE_DIR/.git" ]; then
            git clone https://github.com/corese-stack/corese-core.git "$CORESE_DIR"
          fi
          cd "$CORESE_DIR"
          git fetch origin feature/corese-next
          git checkout "$CORESE_COMMIT"
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon -q
          JAR=$(find build/libs -name "*-jar-with-dependencies.jar" | head -1)
          mkdir -p "$GITHUB_WORKSPACE/libs"
          cp "$JAR" "$GITHUB_WORKSPACE/libs/corese-core-local.jar"
          echo "corese.next JAR built from $CORESE_COMMIT → libs/corese-core-local.jar"

      - name: Set up conda environment
        run: |
          CONDA_SH=$(find $HOME -name "conda.sh" -path "*/profile.d/conda.sh" -not -path "*/pkgs/*" 2>/dev/null | head -1)
          source "$CONDA_SH"
          conda env update -f python-utils/environment.yml --prune

      - name: Run full benchmark
        run: |
          CONDA_SH=$(find $HOME -name "conda.sh" -path "*/profile.d/conda.sh" -not -path "*/pkgs/*" 2>/dev/null | head -1)
          source "$CONDA_SH"
          conda activate benchmarkenv
          python python-utils/workflow.py \
            --engines="corese.next,corese.4.6.5,jena.6.2.0,rdf4j.5.3.2" \
            --datasets="dbpedia,bowlogna,lubm,bsbm" \
            --scales="small" \
            --baseline="site/data/baseline.json"

      - name: Check site/data output
        run: ls -la ./site/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  # ─── Manual run (workflow_dispatch) ───────────────────────────────────────
  benchmark-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, corese-benchmark]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up conda environment
        run: |
          CONDA_SH=$(find $HOME -name "conda.sh" -path "*/profile.d/conda.sh" -not -path "*/pkgs/*" 2>/dev/null | head -1)
          source "$CONDA_SH"
          conda env update -f python-utils/environment.yml --prune

      - name: Build corese.next JAR
        if: contains(github.event.inputs.engines, 'corese.next')
        env:
          CORESE_COMMIT: 1215ab78adbfad7f0edc20e212446780a23182c1
        run: |
          CORESE_DIR="$HOME/corese-next-build"
          if [ ! -d "$CORESE_DIR/.git" ]; then
            git clone https://github.com/corese-stack/corese-core.git "$CORESE_DIR"
          fi
          cd "$CORESE_DIR"
          git fetch origin feature/corese-next
          git checkout "$CORESE_COMMIT"
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon -q
          JAR=$(find build/libs -name "*-jar-with-dependencies.jar" | head -1)
          mkdir -p "$GITHUB_WORKSPACE/libs"
          cp "$JAR" "$GITHUB_WORKSPACE/libs/corese-core-local.jar"
          echo "corese.next JAR built from $CORESE_COMMIT → libs/corese-core-local.jar"

      - name: Run benchmark
        env:
          ENGINES: ${{ github.event.inputs.engines }}
          DATASETS: ${{ github.event.inputs.datasets }}
          SCALES: ${{ github.event.inputs.scales }}
          CORESE_COMMIT: ${{ github.event.inputs.corese_commit }}
          DO_INFERENCE: ${{ github.event.inputs.inference }}
          CACHED_ENGINES: ${{ github.event.inputs.cached_engines }}
          FORCE_ALL: ${{ github.event.inputs.force_all_engines }}
          UPDATE_BASELINE: ${{ github.event.inputs.update_baseline }}
        run: |
          CONDA_SH=$(find $HOME -name "conda.sh" -path "*/profile.d/conda.sh" -not -path "*/pkgs/*" 2>/dev/null | head -1)
          source "$CONDA_SH"
          conda activate benchmarkenv
          EXTRA=""
          [ -n "$CORESE_COMMIT" ] && EXTRA="$EXTRA --coreseCommits=$CORESE_COMMIT"
          [ "$DO_INFERENCE" = "true" ] && EXTRA="$EXTRA --inference"
          [ -n "$CACHED_ENGINES" ] && EXTRA="$EXTRA --cached-engines=$CACHED_ENGINES"
          [ "$FORCE_ALL" = "true" ] && EXTRA="$EXTRA --force-all-engines"
          [ "$UPDATE_BASELINE" = "true" ] && EXTRA="$EXTRA --update-baseline"
          python python-utils/workflow.py \
            --engines="$ENGINES" \
            --datasets="$DATASETS" \
            --scales="$SCALES" \
            --baseline="site/data/baseline.json" \
            $EXTRA

      - name: Check site/data output
        run: ls -la ./site/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
