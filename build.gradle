plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

// CoreseDriver   → Corese 4.x API (RuleEngine.OWL_RL int constant)
// CoreseNextDriver → Corese 5 API from libs/*.jar
// The two drivers use incompatible RuleEngine classes — compile only the one that matches the build.
def localJars = fileTree(dir: 'libs', include: ['*.jar'])
def useLocalCorese = (project.hasProperty('coreseVersion') && project.coreseVersion == 'local')
        || project.hasProperty('coreseJar')
if (useLocalCorese && (!localJars.isEmpty() || project.hasProperty('coreseJar'))) {
    // corese-next build: exclude 4.x driver (incompatible RuleEngine API)
    sourceSets.main.java.exclude '**/CoreseDriver.java'
    if (project.hasProperty('coreseJar')) {
        dependencies { compileOnly files(project.coreseJar) }
    } else {
        dependencies { compileOnly localJars }
    }
} else {
    // corese 4.x build: exclude 5.x driver (requires corese-next JAR)
    sourceSets.main.java.exclude '**/CoreseNextDriver.java'
}

dependencies {
    // Corese
    if (project.hasProperty('coreseJar')) {
        implementation files(project.coreseJar)
    } else if (project.hasProperty('coreseVersion') && project.coreseVersion == 'local') {
        implementation fileTree(dir: 'libs', include: ['*.jar'])
    } else if (project.hasProperty('coreseVersion')) {
        implementation "fr.inria.corese:corese-core:${project.coreseVersion}"
    } else if (project.hasProperty('coreseCommit')) {
        implementation fileTree(dir: project.coreseCommit, include: ['*.jar'])
    } else {
        implementation 'fr.inria.corese:corese-core:4.6.5'
    }

    // Apache Jena
    def jenaVersion = project.hasProperty('jenaVersion') ? project.jenaVersion : '6.2.0'
    implementation "org.apache.jena:jena-core:${jenaVersion}"
    implementation "org.apache.jena:jena-arq:${jenaVersion}"

    // RDF4J
    def rdf4jVersion = project.hasProperty('rdf4jVersion') ? project.rdf4jVersion : '5.3.2'
    implementation "org.eclipse.rdf4j:rdf4j-repository:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-sail-memory:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-repository-sail:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-rio:${rdf4jVersion}"

    // JSON output
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.0'

    // Logging
    implementation 'ch.qos.logback:logback-classic:1.4.14'
}

application {
    mainClass = 'fr.inria.corese.benchmark.Main'
}

task runBenchmark(type: JavaExec) {
    group = 'benchmark'
    description = 'Run the benchmark harness'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'fr.inria.corese.benchmark.Main'
    jvmArgs = [
        '-Xmx12g',
        '-Xms4g',
        '-XX:+UseG1GC'
    ]
}
