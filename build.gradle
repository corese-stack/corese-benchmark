plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

// CoreseDriver   → Corese 4.x API (RuleEngine.OWL_RL int constant)
// CoreseNextDriver → Corese 5 API from libs/*.jar
// The two drivers use incompatible RuleEngine classes — compile only the one that matches the build.
def localJars = fileTree(dir: 'libs', include: ['*.jar'])
def useLocalCorese = (project.hasProperty('coreseVersion') && project.coreseVersion == 'local') || project.hasProperty('coreseJar')
if (useLocalCorese && (!localJars.isEmpty() || project.hasProperty('coreseJar'))) {
    // corese-next build: exclude 4.x driver (incompatible RuleEngine API)
    sourceSets.main.java.exclude '**/CoreseDriver.java'
    // Also exclude tests that directly instantiate CoreseDriver (won't compile without it)
    sourceSets.test.java.exclude '**/CrossEngineConsistencyTest.java'
    sourceSets.test.java.exclude '**/DriverFormatTest.java'
    if (project.hasProperty('coreseJar')) {
        dependencies { compileOnly files(project.coreseJar) }
    } else {
        dependencies { compileOnly localJars }
    }
} else {
    // corese 4.x build: exclude 5.x driver (requires corese-next JAR)
    sourceSets.main.java.exclude '**/CoreseNextDriver.java'
}

dependencies {
    // Corese
    if (project.hasProperty('coreseJar')) {
        implementation files(project.coreseJar)
    } else if (project.hasProperty('coreseVersion') && project.coreseVersion == 'local') {
        implementation fileTree(dir: 'libs', include: ['*.jar'])
    } else if (project.hasProperty('coreseVersion')) {
        implementation "fr.inria.corese:corese-core:${project.coreseVersion}"
    } else if (project.hasProperty('coreseCommit')) {
        implementation fileTree(dir: project.coreseCommit, include: ['*.jar'])
    } else {
        implementation 'fr.inria.corese:corese-core:4.6.5'
    }

    // Apache Jena
    def jenaVersion = project.hasProperty('jenaVersion') ? project.jenaVersion : '6.2.0'
    implementation "org.apache.jena:jena-core:${jenaVersion}"
    implementation "org.apache.jena:jena-arq:${jenaVersion}"
    implementation "org.apache.jena:jena-tdb2:${jenaVersion}"

    // RDF4J
    def rdf4jVersion = project.hasProperty('rdf4jVersion') ? project.rdf4jVersion : '6.1.0'
    implementation "org.eclipse.rdf4j:rdf4j-repository:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-sail-memory:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-sail-nativerdf:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-sail-lmdb:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-repository-sail:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-rio:${rdf4jVersion}"
    // RIO parsers — required for multi-format support (.nq, .ttl, .trig, .rdf, .jsonld)
    implementation "org.eclipse.rdf4j:rdf4j-rio-ntriples:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-rio-nquads:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-rio-turtle:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-rio-trig:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-rio-rdfxml:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-rio-jsonld:${rdf4jVersion}"

    // JSON output
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.0'

    // Logging
    implementation 'ch.qos.logback:logback-classic:1.4.14'

    // Tests
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'fr.inria.corese:corese-core:4.6.5'
    def jenaVersionTest = project.hasProperty('jenaVersion') ? project.jenaVersion : '6.2.0'
    testImplementation "org.apache.jena:jena-core:${jenaVersionTest}"
    testImplementation "org.apache.jena:jena-arq:${jenaVersionTest}"
    testImplementation "org.apache.jena:jena-tdb2:${jenaVersionTest}"
    def rdf4jVersionTest = project.hasProperty('rdf4jVersion') ? project.rdf4jVersion : '6.1.0'
    testImplementation "org.eclipse.rdf4j:rdf4j-repository:${rdf4jVersionTest}"
    testImplementation "org.eclipse.rdf4j:rdf4j-sail-memory:${rdf4jVersionTest}"
    testImplementation "org.eclipse.rdf4j:rdf4j-sail-nativerdf:${rdf4jVersionTest}"
    testImplementation "org.eclipse.rdf4j:rdf4j-sail-lmdb:${rdf4jVersionTest}"
    testImplementation "org.eclipse.rdf4j:rdf4j-repository-sail:${rdf4jVersionTest}"
    testImplementation "org.eclipse.rdf4j:rdf4j-rio:${rdf4jVersionTest}"
    testImplementation "org.eclipse.rdf4j:rdf4j-rio-ntriples:${rdf4jVersionTest}"
    testImplementation "org.eclipse.rdf4j:rdf4j-rio-nquads:${rdf4jVersionTest}"
    testImplementation "org.eclipse.rdf4j:rdf4j-rio-turtle:${rdf4jVersionTest}"
    testImplementation "org.eclipse.rdf4j:rdf4j-rio-trig:${rdf4jVersionTest}"
    testImplementation "org.eclipse.rdf4j:rdf4j-rio-rdfxml:${rdf4jVersionTest}"
    testImplementation "org.eclipse.rdf4j:rdf4j-rio-jsonld:${rdf4jVersionTest}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

def jenaResolvedVersion = project.hasProperty('jenaVersion') ? project.jenaVersion : '6.2.0'
def rdf4jResolvedVersion = project.hasProperty('rdf4jVersion') ? project.rdf4jVersion : '6.1.0'
def coreseResolvedVersion = '4.6.5'
if (project.hasProperty('coreseVersion')) {
    coreseResolvedVersion = project.coreseVersion
} else if (project.hasProperty('coreseCommit')) {
    coreseResolvedVersion = 'commit'
} else if (project.hasProperty('coreseJar')) {
    coreseResolvedVersion = 'jar'
}

def generateEngineProperties = tasks.register('generateEngineProperties') {
    def outputDir = layout.buildDirectory.dir("generated/engine-info")
    outputs.dir(outputDir)
    inputs.property("jenaVersion", jenaResolvedVersion)
    inputs.property("rdf4jVersion", rdf4jResolvedVersion)
    inputs.property("coreseVersion", coreseResolvedVersion)
    doLast {
        def dir = outputDir.get().asFile
        dir.mkdirs()
        def infoFile = new File(dir, "engine-runtimes.properties")
        infoFile.text = "jena.version=${jenaResolvedVersion}\nrdf4j.version=${rdf4jResolvedVersion}\ncorese.version=${coreseResolvedVersion}\n"
    }
}

sourceSets.main.output.dir(generateEngineProperties)
classes.dependsOn(generateEngineProperties)

test {
    useJUnitPlatform()
    maxHeapSize = '4g'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // The corese-next fat JAR bundles its own SLF4J classes (2.x) which conflict
    // with the project's logback-classic (SLF4J 1.x) at test runtime, causing
    // Jena/RDF4J class-loading failures. Remove it from the test classpath; its
    // tests (CoreseDriver-based) are already excluded in local mode above.
    if (useLocalCorese && !localJars.isEmpty()) {
        classpath -= localJars
    }
}

application {
    mainClass = 'fr.inria.corese.benchmark.Main'
}

task runBenchmark(type: JavaExec) {
    group = 'benchmark'
    description = 'Run the benchmark harness'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'fr.inria.corese.benchmark.Main'
    jvmArgs = [
        '-Xmx12g',
        '-Xms4g',
        '-XX:+UseG1GC',
        '--enable-native-access=ALL-UNNAMED'
    ]
}

task convertDatasets(type: JavaExec) {
    group = 'benchmark'
    description = 'Converts canonical N-Triples datasets to all supported W3C formats'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'fr.inria.corese.benchmark.ConvertDatasets'
    jvmArgs = [
        '-Xmx12g',
        '-Xms4g',
        '-XX:+UseG1GC',
        '--enable-native-access=ALL-UNNAMED'
    ]
}
